map $http_upgrade $apas_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name apas.mpaxos.com;
    client_max_body_size 25m;

    # HTTP and HTTPS intentionally share the same routes during the secure
    # transport compatibility window. Enforce the redirect only after every
    # shipped CLI/daemon has moved to WSS and rollback has been exercised.
    ssl_certificate /etc/letsencrypt/live/apas.mpaxos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apas.mpaxos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:APAS_TLS:10m;
    ssl_session_timeout 1d;

    # apas-server (HTTP API + WebSocket) on :8080
    #
    # CAREFUL: every `location /X/ { proxy_pass ... }` below needs a matching
    # `location = /X` when a Next.js page lives at /X. nginx answers a request
    # for a proxied prefix location *minus* its trailing slash with a 301 that
    # appends one -- so a plain /X gets redirected to /X/, matches the API
    # prefix, and 404s on apas-server. That silently killed every share invite
    # (/share?code=... -> /share/?code=... -> 404) and the whole /admin page.
    # An exact-match location outranks the prefix and is exempt from that
    # redirect. Add one whenever you add an API prefix that shadows a page.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $apas_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /auth/  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /admin/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /share/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /projects/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    # Virtual-cluster self-service API. No Next.js page lives at /cluster, so
    # this needs no exact-match companion.
    location /cluster/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /mobile/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    # Share invite page (see the note above the API locations).
    location = /share {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js app on :3000 (everything else, incl. the /share page)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $apas_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
