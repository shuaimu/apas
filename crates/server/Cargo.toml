[package]
name = "apas-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "apas-server"
path = "src/main.rs"

[dependencies]
# Terminal-pane pty bytes ride the wire base64-encoded (see PaneKind::Terminal).
base64 = "0.22"
shared = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }

# Web framework
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
hmac = "0.12"
sha2 = "0.10"

# Utilities
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }

# Concurrent state
dashmap = "5"
rand = "0.8"
regex = "1"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "sendmail-transport"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
