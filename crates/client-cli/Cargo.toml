[package]
name = "apas"
version.workspace = true
edition.workspace = true

[[bin]]
name = "apas"
path = "src/main.rs"

[dependencies]
shared = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }

# WebSocket client. The rustls feature is what lets `wss://` work at all:
# tokio-tungstenite's default features are ["connect", "handshake"] with no TLS,
# and without one its plain `wrap_stream` answers a wss:// URL with
# `TlsFeatureNotEnabled`. That happens *after* the TCP connect, so the socket is
# opened and torn down within a millisecond — the CLI looks like it is silently
# refusing to contact the server, and the only visible trace is one connect per
# reconnect backoff. DEFAULT_SERVER is wss://, so a bare `apas` cannot reach the
# server without this. webpki-roots (bundled Mozilla roots) rather than
# native-roots, matching reqwest below, so the static musl binary carries its own
# trust store instead of depending on whatever the host has.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# CLI
clap = { workspace = true }

# Config
toml = { workspace = true }
directories = { workspace = true }

# Utilities
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
hostname = "0.4.2"
# `termination` so SIGTERM sets the shutdown flag instead of ending the process
# outright. Without it only SIGINT is handled, and a `setsid`-detached daemon
# essentially never receives one — so the shutdown that stops each project and
# saves its pane roster was unreachable in practice.
ctrlc = { version = "3.4", features = ["termination"] }

# TUI for dual-pane mode
ratatui = "0.29"
crossterm = "0.28"

# HTTP client for auth. rustls (pure Rust) instead of the default
# native-tls/OpenSSL so the CLI links no C TLS stack and builds cleanly for
# the static musl target (see build.target in .cargo/config.toml). http2 +
# charset are re-added because default-features=false drops them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }

# Home directory detection
dirs = "5.0"

# File-change watcher for event-driven deadloop wake-ups (replaces the
# pure sleep between iterations so panes wake on team-todo.md /
# .apas-team.jsonl / project_goal.md edits instead of paying tokens
# every cycle just to confirm "nothing changed").
notify = "6"

# Pty host for `PaneKind::Terminal` panes, which run the provider's real
# interactive TUI instead of the headless stream-json worker. wezterm's
# crate; verified to build for the static musl target (it reaches libc's
# openpty, which musl provides, and needs no extra C toolchain beyond the
# musl-gcc already configured in .cargo/config.toml for ring).
portable-pty = "0.9"

# Pty bytes are base64'd onto the wire: a read can split both UTF-8
# sequences and ANSI escapes, so the frames can't be typed as JSON strings.
base64 = "0.22"
tempfile = "3"

# MCP server (`apas mcp-server`) — the typed front door panes use instead of
# hand-assembling `.apas-team.jsonl` tags in bash. Official Rust SDK; verified
# to build for the static musl target. `schemars` is what derives each tool's
# JSON schema from its argument struct, so the schema can't drift from the code.
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
schemars = "1"

# Unix process management
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
