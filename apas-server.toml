[server]
host = "0.0.0.0"
port = 8080

[database]
path = "./data/apas.db"

[auth]
# IMPORTANT: Change this in production!
jwt_secret = "change-me-in-production-use-a-secure-random-string"
token_expiry_hours = 24

# The deployment's single system administrator, reachable only at /admin with
# its own login. This is a credential, not an account: it is stored outside the
# users table and cannot be granted to any account through the UI.
#
# `bootstrap_password` seeds the credential the first time the server starts
# without one, and is ignored afterwards. Set it before the first upgraded
# start, keep this file mode 0600, and rotate the password from the
# administration surface after signing in.
[system_admin]
username = "admin"
bootstrap_password = ""
token_expiry_minutes = 120
max_failed_attempts = 5
lockout_seconds = 300
